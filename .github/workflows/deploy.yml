# Tests every push, then puts the platform online:
#   - the API goes to your Supabase project as the Edge Function "api"
#   - the website (the web/ folder) goes to GitHub Pages
# Needs (see README, "Put it online"):
#   repository variable  SUPABASE_PROJECT_REF   e.g. abcdefghijklmnopqrst
#   repository secrets   SUPABASE_ACCESS_TOKEN or SUPABASE_TOKEN  (from supabase.com > Account > Access tokens)
#                        SETUP_CODE             (any long random text; needed for first setup and staff recovery)
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the built question bank matches content/
        run: git diff --exit-code supabase/functions/_shared/content.js || (echo "Run npm run build and commit supabase/functions/_shared/content.js" && exit 1)

  backend:
    needs: test
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SETUP_CODE: ${{ secrets.SETUP_CODE }}
      ORIGIN: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v5
      # pinned: "latest" needs a GitHub lookup that can hit rate limits, and CLI v3 changed deploy behaviour
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Set the function's secrets
        run: |
          if [ -n "$SETUP_CODE" ]; then supabase secrets set --project-ref "$REF" SETUP_CODE="$SETUP_CODE" ALLOWED_ORIGIN="${ORIGIN,,}";
          else supabase secrets set --project-ref "$REF" ALLOWED_ORIGIN="${ORIGIN,,}"; fi
      - name: Deploy the API
        run: supabase functions deploy api --project-ref "$REF" --no-verify-jwt --use-api

  site:
    needs: test
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Point the website at the Supabase API
        run: echo "window.GF_API='https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1';" > web/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
